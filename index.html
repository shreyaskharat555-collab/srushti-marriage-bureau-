function landing(){root.innerHTML=`<div class="top">A faith-centered Protestant Christian matrimonial service • Privacy • Respect • Serious intentions</div><nav class="nav"><div class="brand">Srushti Marriage Bureau<small>PROTESTANT CHRISTIAN MATRIMONY</small></div><div class="navlinks"><button class="btn ghost optional" onclick="scrollTo({top:650,behavior:'smooth'})">How it works</button><button class="btn light" onclick="auth('login')">Log in</button><button class="btn gold" onclick="auth('signup')">Create profile</button></div></nav><section class="hero"><div><div class="eyebrow">Faith • Compatibility • Marriage</div><h1>Meet someone who shares your faith and your future.</h1><p>A thoughtful matrimonial platform for Protestant Christians, built around real biodata, meaningful preferences, respectful introductions and genuine connections.</p><div class="actions"><button class="btn gold" onclick="auth('signup')">Create your matrimonial profile</button><button class="btn light" onclick="document.querySelector('.section').scrollIntoView({behavior:'smooth'})">Explore the journey</button></div><div class="verse">“Two are better than one.” — Ecclesiastes 4:9</div></div><div class="heroimg"></div></section><div class="quick"><div class="field"><label>I am looking for</label><select id="qgender"><option value="Female">A woman</option><option value="Male">A man</option></select></div><div class="field"><label>Age</label><select id="qage"><option>18-25</option><option selected>26-35</option><option>36-45</option><option>46-60</option></select></div><div class="field"><label>City</label><input id="qcity" placeholder="Any city"></div><div class="field"><label>Denomination</label><select id="qden"><option value="">Any Protestant</option><option>Baptist</option><option>Methodist</option><option>Presbyterian</option><option>Pentecostal</option><option>Evangelical</option><option>Other Protestant</option></select></div><button class="btn gold" onclick="auth('signup')">Search matches</button></div><section class="section"><div class="sectionhead"><div class="eyebrow">Built for serious relationships</div><h2>A proper matrimonial experience, not a social feed.</h2><p class="meta">Complete your story, define your partner preferences, discover compatible members, express interest, connect after acceptance, and communicate privately.</p></div><div class="cards"><div class="trust"><div class="icon">✦</div><h3>Real biodata</h3><p class="meta">Personal, faith, education, career, family, lifestyle and partner-preference fields.</p></div><div class="trust"><div class="icon">♡</div><h3>Compatibility matching</h3><p class="meta">Matches are scored across age, location, faith, education, lifestyle, language and other preferences.</p></div><div class="trust"><div class="icon">✓</div><h3>Safety first</h3><p class="meta">Verification, privacy controls, blocking, reporting and connection-gated messaging.</p></div></div></section><section class="section" style="background:#fff"><div class="sectionhead"><div class="eyebrow">How it works</div><h2>From profile to meaningful connection.</h2></div><div class="cards"><div class="step"><b>01 · Create your profile</b><p class="meta">Tell us who you are and what kind of Christian marriage you are seeking.</p></div><div class="step"><b>02 · Discover matches</b><p class="meta">Use your preferences and search tools to find members who fit your criteria.</p></div><div class="step"><b>03 · Express interest</b><p class="meta">Send a respectful interest. The other member can accept or decline.</p></div><div class="step"><b>04 · Connect privately</b><p class="meta">Accepted connections unlock private messaging and notifications.</p></div></div></section><section class="section"><div class="faq"><div class="sectionhead"><div class="eyebrow">Questions</div><h2>Simple, transparent and respectful.</h2></div><details><summary>What are the charges?</summary><p class="meta">The registration fee is ₹2,999. After a successful marriage, an additional ₹2,000 success charge applies for the efforts and services involved, making the total potential fee ₹4,999. Payment integration will be added as the final stage.</p></details><details><summary>Can I control who contacts me?</summary><p class="meta">Yes. Connections require an accepted interest. You can also block or report members.</p></details><details><summary>Are profiles verified?</summary><p class="meta">Members can request verification. Verification status is displayed on profiles after review.</p></details></div></section><footer class="footer"><div><b>Srushti Marriage Bureau</b><p class="small" style="color:#d8e0e7">Protestant Christian Matrimony</p></div><div class="small" style="color:#d8e0e7">© 2026 Srushti Marriage Bureau • Built for serious matrimonial intentions</div></footer></div>`}
function auth(mode){openModal(`<div class="eyebrow">Srushti Marriage Bureau</div><h2 style="font-size:38px;color:var(--navy)">${mode==='signup'?'Create your matrimonial account':'Welcome back'}</h2><p class="meta">${mode==='signup'?'Start with your email account. Payment will be integrated later; for now you can build and test your profile.':'Log in to continue to your matrimonial dashboard.'}</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>${mode==='signup'?'<div class="notice">Registration fee: <b>₹2,999</b><br><span class="small">Payment is intentionally being added at the final stage.</span></div>':''}<button class="btn gold" style="width:100%" onclick="${mode==='signup'?'signup()':'login()'}">${mode==='signup'?'Create account':'Log in'}</button><button class="btn light" style="width:100%;margin-top:8px" onclick="closeModal()">Go Back</button>`)}
async function signup(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return toast('Use a valid email and a password of at least 6 characters.');const r=await sb.auth.signUp({email,password});if(r.error)return toast(r.error.message);if(r.data.session){user=r.data.user;closeModal();await bootMember();}else toast('Account created. Check your email if confirmation is enabled in Supabase.')}

async function bootMember(){await loadMe();if(!profile||!profile.full_name){showProfileForm();}else showApp('matches')}
async function loadMe(){const u=await sb.auth.getUser();user=u.data.user;if(!user)return landing();let p=await sb.from('profiles').select('*').eq('id',user.id).single();if(p.error&&p.error.code!=='PGRST116')toast(p.error.message);profile=p.data||null;let q=await sb.from('partner_preferences').select('*').eq('user_id',user.id).maybeSingle();prefs=q.data||{user_id:user.id,min_age:18,max_age:70,preferred_cities:[],preferred_denominations:[]}}

async function getCandidates(){let r=await sb.from('profiles').select('*').eq('active',true).eq('profile_complete',true).neq('id',user.id).limit(200);return r.data||[]}

function score(c){let p=prefs||{},s=0,w=0;const arr=(x)=>Array.isArray(x)?x:[];const one=(v,a)=>{if(!v)return;w++;if(a&&String(v).toLowerCase()===String(a).toLowerCase())s++};const many=(v,a)=>{if(!v||!arr(v).length)return;w++;if(arr(v).some(x=>String(x).toLowerCase()===String(a||'').toLowerCase()))s++};if(p.preferred_gender){w++;if(c.gender===p.preferred_gender)s++}if(c.age){w++;if(c.age>=+(p.min_age||18)&&c.age<=+(p.max_age||70))s++}many(p.preferred_cities,c.city);many(p.preferred_states,c.state);many(p.preferred_denominations,c.denomination);many(p.preferred_marital_statuses,c.marital_status);many(p.preferred_education,c.education);many(p.preferred_professions,c.profession);many(p.preferred_languages,c.mother_tongue);many(p.preferred_faith_commitment,c.faith_commitment);many(p.preferred_diet,c.diet);many(p.preferred_smoking,c.smoking);many(p.preferred_drinking,c.drinking);if(p.must_be_verified){w++;if(c.verified)s++}return w?Math.round(s/w*100):0}
async function searchPage(){let all=await getCandidates(),blocked=await blockedIds();candidates=all.filter(c=>!blocked.has(c.id)).map(c=>({...c,match_score:score(c)}));let likes=await sb.from('likes').select('liked_profile_id').eq('user_id',user.id);let liked=new Set((likes.data||[]).map(x=>x.liked_profile_id));return `<div class="dashhead"><div><div class="eyebrow">Find members</div><h1>Search</h1><p class="meta">Search active, complete matrimonial profiles by name, city, profession, denomination or education.</p></div></div><div class="toolbar"><input id="squery" placeholder="Name, city, church, profession…" oninput="filterSearch()"><select id="sgender" onchange="filterSearch()"><option value="">Any gender</option><option>Male</option><option>Female</option></select><select id="sden" onchange="filterSearch()"><option value="">Any denomination</option>${[...new Set(candidates.map(x=>x.denomination).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="sage" onchange="filterSearch()"><option value="0">Any age</option><option value="25">18–25</option><option value="35">26–35</option><option value="45">36–45</option><option value="60">46–60</option></select></div><div id="searchgrid" class="cards">${candidates.length?candidates.map(c=>card(c,liked.has(c.id))).join(''):`<div class="empty"><h3>No members found</h3><p class="meta">Try broader search criteria.</p></div>`}</div>`}
function filterSearch(){const q=($('squery')?.value||'').toLowerCase(),g=$('sgender')?.value||'',d=$('sden')?.value||'',max=+$('sage')?.value||0;document.querySelectorAll('#searchgrid .candidate').forEach(x=>{const text=(x.dataset.name||'');const gender=(x.querySelector('.eyebrow')?.textContent||'');const ok=text.includes(q)&&(!g||gender.toLowerCase().includes(g.toLowerCase()))&&(!d||text.includes(d.toLowerCase()))&&(!max||!x.dataset.age||+x.dataset.age<=max);x.style.display=ok?'':'none'})}
async function matchesPage(){const all=await getCandidates(),blocked=await blockedIds();candidates=all.filter(c=>!blocked.has(c.id)).map(c=>({...c,match_score:score(c)})).sort((a,b)=>b.match_score-a.match_score);let likes=await sb.from('likes').select('liked_profile_id').eq('user_id',user.id);let liked=new Set((likes.data||[]).map(x=>x.liked_profile_id));return `<div class="dashhead"><div><div class="eyebrow">Personalised discovery</div><h1>Recommended matches</h1><p class="meta">Profiles ranked against your partner preferences. Update your preferences anytime.</p></div><button class="btn gold" onclick="showApp('profile')">Edit preferences</button></div><div class="stats"><div class="stat"><b>${candidates.length}</b><span>Compatible members</span></div><div class="stat"><b>${candidates.filter(x=>x.match_score>=70).length}</b><span>70%+ matches</span></div><div class="stat"><b>${liked.size}</b><span>Profiles liked</span></div><div class="stat"><b>${profile?.verified?'✓':'—'}</b><span>Your verification</span></div></div><div class="toolbar"><input id="mquery" placeholder="Search name, city, church…" oninput="filterCards()"><select id="mcity" onchange="filterCards()"><option value="">All cities</option>${[...new Set(candidates.map(x=>x.city).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="mscore" onchange="filterCards()"><option value="0">Any match score</option><option value="70">70%+</option><option value="80">80%+</option><option value="90">90%+</option></select><select id="mver" onchange="filterCards()"><option value="">All verification</option><option value="true">Verified only</option></select></div><div id="cardgrid" class="cards">${candidates.length?candidates.map(c=>card(c,liked.has(c.id))).join(''):`<div class="empty"><h3>No compatible profiles yet</h3><p class="meta">Complete your biodata and broaden preferences to see more members.</p></div>`}</div>`}
function photo(c){return c.photo_url?`style="background-image:url('${esc(c.photo_url)}')"`:'style=""'}
function card(c,liked=false){return `<article class="profilecard candidate" data-name="${esc((c.full_name+' '+c.city+' '+c.church+' '+c.profession).toLowerCase())}" data-city="${esc(c.city||'')}" data-score="${c.match_score||0}" data-ver="${c.verified}" data-age="${c.age||''}"><div class="portrait" ${photo(c)}>♡</div><div class="pcbody"><div class="eyebrow">${c.verified?'✓ Verified member':'Christian member'} · ${c.match_score||0}% match</div><h3>${esc(c.full_name)}</h3><div class="meta">${c.age||''}${c.city?' · '+esc(c.city):''}${c.profession?' · '+esc(c.profession):''}<br>${esc(c.denomination||'Protestant')} · ${esc(c.church||'Faith community')}</div><div class="pills"><span class="pill">${esc(c.marital_status||'Seeking marriage')}</span><span class="pill">${esc(c.education||'Education not added')}</span></div><p class="meta">${esc((c.bio||'Faith-centered member seeking a meaningful Christian marriage.').slice(0,135))}</p><div class="actions"><button class="btn gold" onclick="toggleLike('${c.id}')">${liked?'♥ Liked':'♡ Like'}</button><button class="btn light" onclick="openProfile('${c.id}')">View Profile</button><button class="btn light" onclick="sendInterest('${c.id}')">Express Interest</button></div></div></article>`}
function filterCards(){const q=($('mquery')?.value||'').toLowerCase(),city=$('mcity')?.value||'',score=+$('mscore')?.value||0,ver=$('mver')?.value||'';document.querySelectorAll('.candidate').forEach(x=>{let ok=x.dataset.name.includes(q)&&(!city||x.dataset.city===city)&&+x.dataset.score>=score&&(!ver||x.dataset.ver===ver);x.style.display=ok?'':'none'})}
async function toggleLike(id){const old=await sb.from('likes').select('*').eq('user_id',user.id).eq('liked_profile_id',id).maybeSingle();let r=old.data?await sb.from('likes').delete().eq('user_id',user.id).eq('liked_profile_id',id):await sb.from('likes').insert({user_id:user.id,liked_profile_id:id});if(r.error)return toast(r.error.message);toast(old.data?'Removed from likes':'Added to likes');showApp('matches')}
async function sendInterest(id){const msg=prompt('Optional message to accompany your interest:')??'';let existing=await sb.from('interests').select('*').eq('sender_id',user.id).eq('receiver_id',id).maybeSingle();if(existing.data)return toast('You already sent an interest to this member.');let r=await sb.from('interests').insert({sender_id:user.id,receiver_id:id,message:msg||null});if(r.error)return toast(r.error.message);toast('Interest sent respectfully.');}
async function openProfile(id){const r=await sb.from('profiles').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);selected=r.data;await sb.from('profile_views').upsert({viewer_id:user.id,viewed_id:id,viewed_at:new Date().toISOString()});let ph=await sb.from('profile_photos').select('*').eq('user_id',id).eq('approved',true).order('sort_order');let photos=ph.data||[];openModal(`<div class="profilehero"><div><div class="bigphoto" ${photo(selected)}></div>${photos.length?`<div class="photo-grid" style="margin-top:10px">${photos.slice(0,4).map(x=>`<div class="photo" style="background-image:url('${esc(x.public_url||'')}')"></div>`).join('')}</div>`:''}</div><div><div class="eyebrow">${selected.verified?'✓ Verified member':'Christian member'}</div><h2 style="font-size:42px;color:var(--navy);margin:7px 0">${esc(selected.full_name)}</h2><p class="meta">${selected.age||''} · ${esc(selected.city||'India')} · ${esc(selected.profession||'')}<br>${esc(selected.denomination||'Protestant')} · ${esc(selected.church||'Faith community')}</p><div class="pills"><span class="pill">${esc(selected.marital_status||'')}</span><span class="pill">${esc(selected.education||'')}</span><span class="pill">${esc(selected.faith_commitment||'')}</span></div><h3>About</h3><p class="meta">${esc(selected.bio||'No introduction added yet.')}</p><h3>Family</h3><p class="meta">${esc(selected.family_details||'Family details not added yet.')}</p><h3>Faith & lifestyle</h3><p class="meta">${esc([selected.baptism_status,selected.diet,selected.smoking,selected.drinking,selected.mother_tongue].filter(Boolean).join(' · ')||'Details not added')}</p><div class="actions"><button class="btn gold" onclick="sendInterest('${selected.id}');closeModal()">Express Interest</button><button class="btn light" onclick="toggleLike('${selected.id}');closeModal()">♡ Like</button><button class="btn danger" onclick="reportMember('${selected.id}')">Report</button><button class="btn light" onclick="blockMember('${selected.id}')">Block</button></div></div></div>`)}
async function interestsPage(){let [sent,recv]=await Promise.all([sb.from('interests').select('*,receiver:profiles!interests_receiver_id_fkey(id,full_name,photo_url,city,profession,verified)').eq('sender_id',user.id).order('created_at',{ascending:false}),sb.from('interests').select('*,sender:profiles!interests_sender_id_fkey(id,full_name,photo_url,city,profession,verified)').eq('receiver_id',user.id).order('created_at',{ascending:false})]);return `<div class="dashhead"><div><div class="eyebrow">Introductions</div><h1>Interests</h1><p class="meta">Send respectful introductions and respond to people who have shown interest.</p></div></div><div class="tabs"><button class="active" onclick="interestsTab('received')">Received (${(recv.data||[]).length})</button><button onclick="interestsTab('sent')">Sent (${(sent.data||[]).length})</button></div><div id="interestlist">${interestList(recv.data||[],'received')}</div>`}
function interestList(list,type){if(!list.length)return `<div class="empty"><h3>No ${type} interests yet</h3><p class="meta">Your interests will appear here.</p></div>`;return `<div class="list">${list.map(i=>{let p=type==='received'?i.sender:i.receiver;return `<div class="listrow"><div><b>${esc(p?.full_name||'Member')}</b><div class="meta">${esc(p?.city||'')} · ${esc(p?.profession||'')} · ${i.status}</div>${i.message?`<p class="small">“${esc(i.message)}”</p>`:''}</div><div class="actions">${type==='received'&&i.status==='pending'?`<button class="btn gold" onclick="respondInterest('${i.id}','accepted')">Accept</button><button class="btn light" onclick="respondInterest('${i.id}','declined')">Decline</button>`:''}${type==='sent'&&i.status==='pending'?`<button class="btn light" onclick="withdrawInterest('${i.id}')">Withdraw</button>`:''}${i.status==='accepted'?'<span class="pill">Connected</span>':''}</div></div>`}).join('')}</div>`}
async function interestsTab(type){let col=type==='received'?'receiver_id':'sender_id';let r=await sb.from('interests').select(`*,${type==='received'?'sender':'receiver'}:profiles!interests_${type==='received'?'sender':'receiver'}_id_fkey(id,full_name,photo_url,city,profession,verified)`).eq(col,user.id).order('created_at',{ascending:false});$('interestlist').innerHTML=interestList(r.data||[],type)}
async function respondInterest(id,status){let r=await sb.from('interests').update({status,responded_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);toast(status==='accepted'?'Connection created. Messaging is now available.':'Interest declined.');showApp('interests')}
async function withdrawInterest(id){let r=await sb.from('interests').update({status:'withdrawn'}).eq('id',id).eq('sender_id',user.id);if(r.error)return toast(r.error.message);showApp('interests')}
async function connectionsPage(){let r=await sb.from('connections').select('*').or(`user_a.eq.${user.id},user_b.eq.${user.id}`).order('created_at',{ascending:false});let ids=(r.data||[]).map(c=>c.user_a===user.id?c.user_b:c.user_a);let ps=ids.length?await sb.from('profiles').select('id,full_name,photo_url,city,profession,verified').in('id',ids):{data:[]};let map=new Map((ps.data||[]).map(p=>[p.id,p]));return `<div class="dashhead"><div><div class="eyebrow">Accepted relationships</div><h1>Your connections</h1><p class="meta">Only accepted connections can message each other.</p></div></div><div class="list">${ids.length?ids.map(id=>{let p=map.get(id)||{};let c=(r.data||[]).find(x=>x.user_a===id||x.user_b===id);return `<div class="listrow"><div><b>${esc(p.full_name||'Member')} ${p.verified?'✓':''}</b><div class="meta">${esc(p.city||'')} · ${esc(p.profession||'')}</div></div><button class="btn gold" onclick="openChat('${c.id}','${id}')">Message</button></div>`}).join(''):`<div class="empty"><h3>No connections yet</h3><p class="meta">When an interest is accepted, the connection will appear here.</p></div>`}</div>`}
async function messagesPage(){return `<div class="dashhead"><div><div class="eyebrow">Private messaging</div><h1>Messages</h1><p class="meta">Messaging is available only after an interest has been accepted.</p></div></div><div id="messageArea"><div class="empty"><h3>Select a connection</h3><p class="meta">Open a connection from the Connections tab to start messaging.</p><button class="btn gold" onclick="showApp('connections')">View connections</button></div></div>`}
async function openChat(connectionId,otherId){activeChat={connectionId,otherId};await showApp('messages');let p=await sb.from('profiles').select('full_name').eq('id',otherId).single();$('messageArea').innerHTML=`<div class="chat"><aside class="chatlist"><b>${esc(p.data?.full_name||'Connection')}</b><p class="small">Private connected conversation</p><button class="btn light" onclick="showApp('connections')">← Connections</button></aside><section class="chatmain"><div id="chatmsgs" class="chatmsgs"></div><div class="chatinput"><input id="chattext" placeholder="Write a respectful message…" maxlength="4000" onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn gold" onclick="sendMessage()">Send</button></div></section></div>`;await refreshChat();clearInterval(chatTimer);chatTimer=setInterval(refreshChat,5000)}
async function refreshChat(){if(!activeChat||!$('chatmsgs'))return;let r=await sb.from('messages').select('*').eq('connection_id',activeChat.connectionId).order('created_at');if(r.error)return;let box=$('chatmsgs');box.innerHTML=(r.data||[]).map(m=>`<div class="bubble ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<div style="font-size:9px;opacity:.65;margin-top:5px">${new Date(m.created_at).toLocaleString()}</div></div>`).join('')||'<div class="empty">No messages yet. Say hello.</div>';box.scrollTop=box.scrollHeight}
async function sendMessage(){let body=$('chattext')?.value.trim();if(!body||!activeChat)return;let r=await sb.from('messages').insert({connection_id:activeChat.connectionId,sender_id:user.id,body});if(r.error)return toast(r.error.message);$('chattext').value='';await refreshChat()}
async function visitorsPage(){let r=await sb.from('profile_views').select('viewer_id,viewed_at').eq('viewed_id',user.id).order('viewed_at',{ascending:false});let ids=[...new Set((r.data||[]).map(x=>x.viewer_id))];let ps=ids.length?await sb.from('profiles').select('id,full_name,city,profession,photo_url,verified').in('id',ids):{data:[]};let map=new Map((ps.data||[]).map(p=>[p.id,p]));return `<div class="dashhead"><div><div class="eyebrow">Who noticed you</div><h1>Profile visitors</h1><p class="meta">Members who recently viewed your profile.</p></div></div><div class="list">${ids.length?ids.map(id=>{let p=map.get(id)||{};return `<div class="listrow"><div><b>${esc(p.full_name||'Member')} ${p.verified?'✓':''}</b><div class="meta">${esc(p.city||'')} · ${esc(p.profession||'')}</div></div><button class="btn light" onclick="openProfile('${id}')">View profile</button></div>`}).join(''):`<div class="empty"><h3>No visitors yet</h3><p class="meta">As members discover your profile, recent visitors will appear here.</p></div>`}</div>`}
function profilePage(){const p=profile||{};return `<div class="dashhead"><div><div class="eyebrow">Your story</div><h1>My Biodata</h1><p class="meta">Keep your matrimonial profile complete and current.</p></div><button class="btn gold" onclick="showProfileForm()">Edit biodata</button></div><div class="panel" style="max-width:1100px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px"><div class="profilehero"><div><div class="bigphoto" ${photo(p)}></div><div class="verify" style="margin-top:10px">${p.verified?'✓ Your profile is verified':'Verification: '+esc(p.verification_status||'unverified')}<br><span class="small">${p.profile_complete?'Profile complete':'Complete your biodata to improve matching'}</span></div></div><div><div class="eyebrow">${esc(p.denomination||'Protestant')}</div><h2 style="font-size:38px;color:var(--navy);margin:6px 0">${esc(p.full_name||'Your name')}</h2><p class="meta">${p.age||''} · ${esc(p.city||'')} · ${esc(p.profession||'')} · ${esc(p.education||'')}</p><h3>About me</h3><p class="meta">${esc(p.bio||'Add your introduction.')}</p><h3>Faith & church</h3><p class="meta">${esc([p.church,p.baptism_status,p.faith_commitment].filter(Boolean).join(' · ')||'Add your faith details.')}</p><h3>Family</h3><p class="meta">${esc(p.family_details||'Add family details.')}</p><h3>Partner preferences</h3><p class="meta">${esc(prefSummary())}</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:28px 0"><h3>Your photos</h3><div id="myphotos" class="photo-grid">Loading…</div><div class="actions"><label class="btn gold">Upload photos<input type="file" accept="image/*" multiple style="display:none" onchange="uploadPhotos(event)"></label><button class="btn light" onclick="requestVerification()">Request verification</button></div></div>`}
function prefSummary(){const p=prefs||{};return `Age ${p.min_age||18}–${p.max_age||70}${p.preferred_gender?' · '+p.preferred_gender:''}${p.preferred_cities?.length?' · Cities: '+p.preferred_cities.join(', '):''}${p.preferred_denominations?.length?' · Faith: '+p.preferred_denominations.join(', '):''}`}
async function showProfileForm(){const p=profile||{},q=prefs||{};openModal(`<div class="eyebrow">Biodata & partner preferences</div><h2 style="font-size:36px;color:var(--navy)">Build a complete matrimonial profile</h2><form onsubmit="saveBiodata(event)"><h3>About you</h3><div class="grid2"><div class="field"><label>Full name *</label><input id="f_name" required value="${esc(p.full_name)}"></div><div class="field"><label>Date of birth *</label><input id="f_dob" type="date" required value="${esc(p.date_of_birth||'')}"></div><div class="field"><label>Gender *</label>${sel('f_gender',['Male','Female'],p.gender)}</div><div class="field"><label>Marital status</label>${sel('f_marital',['Never married','Divorced','Widowed','Separated'],p.marital_status)}</div><div class="field"><label>City</label><input id="f_city" value="${esc(p.city)}"></div><div class="field"><label>State</label><input id="f_state" value="${esc(p.state)}"></div><div class="field"><label>Height (cm)</label><input id="f_height" type="number" value="${esc(p.height_cm||'')}"></div><div class="field"><label>Mother tongue</label><input id="f_lang" value="${esc(p.mother_tongue)}"></div><div class="field"><label>Education</label><input id="f_edu" value="${esc(p.education)}"></div><div class="field"><label>Profession</label><input id="f_prof" value="${esc(p.profession)}"></div><div class="field"><label>Company</label><input id="f_company" value="${esc(p.company)}"></div><div class="field"><label>Income range</label><input id="f_income" value="${esc(p.income_range)}" placeholder="e.g. ₹5–10 LPA"></div></div><h3>Christian faith</h3><div class="grid2"><div class="field"><label>Denomination</label><input id="f_den" value="${esc(p.denomination||'Protestant')}"></div><div class="field"><label>Church / fellowship</label><input id="f_church" value="${esc(p.church)}"></div><div class="field"><label>Baptism</label>${sel('f_baptism',['Baptized','Not baptized','Prefer not to say'],p.baptism_status)}</div><div class="field"><label>Faith commitment</label>${sel('f_faith',['Very important','Important','Open to discussion'],p.faith_commitment)}</div></div><h3>Lifestyle & family</h3><div class="grid2"><div class="field"><label>Diet</label>${sel('f_diet',['Vegetarian','Non-vegetarian','Vegan','Other'],p.diet)}</div><div class="field"><label>Smoking</label>${sel('f_smoke',['No','Occasionally','Yes'],p.smoking)}</div><div class="field"><label>Drinking</label>${sel('f_drink',['No','Occasionally','Yes'],p.drinking)}</div><div class="field"><label>Children</label>${sel('f_children',['No children','Has children','Open to children'],p.children)}</div><div class="field"><label>Father occupation</label><input id="f_father" value="${esc(p.father_occupation)}"></div><div class="field"><label>Mother occupation</label><input id="f_mother" value="${esc(p.mother_occupation)}"></div><div class="field"><label>Siblings</label><input id="f_siblings" value="${esc(p.siblings)}"></div></div><div class="field"><label>About you</label><textarea id="f_bio" rows="5" placeholder="Write a warm, honest introduction.">${esc(p.bio)}</textarea></div><div class="field"><label>Family details</label><textarea id="f_family" rows="4">${esc(p.family_details)}</textarea></div><h3>Partner preferences</h3><div class="grid2"><div class="field"><label>Preferred gender</label>${sel('p_gender',['Male','Female'],q.preferred_gender)}</div><div class="field"><label>Minimum age</label><input id="p_min" type="number" min="18" max="100" value="${q.min_age||18}"></div><div class="field"><label>Maximum age</label><input id="p_max" type="number" min="18" max="100" value="${q.max_age||70}"></div><div class="field"><label>Preferred cities (comma separated)</label><input id="p_cities" value="${esc((q.preferred_cities||[]).join(', '))}"></div><div class="field"><label>Preferred states (comma separated)</label><input id="p_states" value="${esc((q.preferred_states||[]).join(', '))}"></div><div class="field"><label>Preferred denominations</label><inpu function sel(id,opts,val){return `<select id="${id}"><option value="">Select</option>${opts.map(o=>`<option ${String(val||'')===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
const csv=id=>($(''+id)?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
async function saveBiodata(e){e.preventDefault();const dob=$('f_dob').value;const payload={id:user.id,email:user.email,full_name:$('f_name').value.trim(),date_of_birth:dob,gender:$('f_gender').value,marital_status:$('f_marital').value,city:$('f_city').value.trim(),state:$('f_state').value.trim(),height_cm:+$('f_height').value||null,mother_tongue:$('f_lang').value.trim(),education:$('f_edu').value.trim(),profession:$('f_prof').value.trim(),company:$('f_company').value.trim(),income_range:$('f_income').value.trim(),denomination:$('f_den').value.trim()||'Protestant',church:$('f_church').value.trim(),baptism_status:$('f_baptism').value,faith_commitment:$('f_faith').value,diet:$('f_diet').value,smoking:$('f_smoke').value,drinking:$('f_drink').value,children:$('f_children').value,father_occupation:$('f_father').value.trim(),mother_occupation:$('f_mother').value.trim(),siblings:$('f_siblings').value.trim(),bio:$('f_bio').value.trim(),family_details:$('f_family').value.trim(),profile_complete:true};let r=await sb.from('profiles').upsert(payload);if(r.error)return toast(r.error.message);const pp={user_id:user.id,preferred_gender:$('p_gender').value,min_age:+$('p_min').value,max_age:+$('p_max').value,preferred_cities:csv('p_cities'),preferred_states:csv('p_states'),preferred_denominations:csv('p_den'),preferred_education:csv('p_edu'),preferred_professions:csv('p_prof'),preferred_languages:csv('p_lang'),preferred_faith_commitment:csv('p_faith'),preferred_diet:csv('p_diet'),preferred_smoking:csv('p_smoke'),preferred_drinking:csv('p_drink')};r=await sb.from('partner_preferences').upsert(pp);if(r.error)return toast(r.error.message);closeModal();await loadMe();toast('Biodata saved. Your matches are being calculated.');showApp('matches')}
async function loadMyPhotos(){const box=$('myphotos');if(!box||!user)return;let r=await sb.from('profile_photos').select('*').eq('user_id',user.id).order('sort_order');if(r.error)return;const photos=r.data||[];box.innerHTML=photos.length?photos.map(x=>`<div class="photo" style="background-image:url('${esc(x.public_url||'')}')"><span class="pill" style="position:absolute;left:6px;bottom:6px">${x.is_primary?'Primary photo':''}</span></div>`).join(''):'<div class="empty" style="grid-column:1/-1">No photos uploaded yet. Add a clear, respectful profile photo to help members recognise your profile.</div>'}
async function uploadPhotos(e){const files=[...(e.target.files||[])].slice(0,6);if(!files.length)return;for(const f of files){if(f.size>6*1024*1024){toast('Each photo must be under 6 MB.');continue}const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${user.id}/${crypto.randomUUID()}.${ext}`;let u=await sb.storage.from('profile-photos').upload(path,f,{upsert:false,contentType:f.type});if(u.error){toast(u.error.message);continue}const pub=sb.storage.from('profile-photos').getPublicUrl(path).data.publicUrl;await sb.from('profile_photos').insert({user_id:user.id,storage_path:path,public_url:pub,is_primary:!profile.photo_url,sort_order:Date.now()});if(!profile.photo_url){await sb.from('profiles').update({photo_url:pub}).eq('id',user.id);profile.photo_url=pub}}toast('Photo upload complete.');showApp('profile')}
async function requestVerification(){let r=await sb.from('verification_requests').insert({user_id:user.id});if(r.error)return toast(r.error.message);await sb.from('profiles').update({verification_status:'pending'}).eq('id',user.id);toast('Verification request submitted. A reviewer can approve it later.');showApp('profile')}
async function reportMember(id){const reason=prompt('Reason for report (fake profile, harassment, inappropriate content, other):');if(!reason)return;let details=prompt('Optional details:')||'';let r=await sb.from('reports').insert({reporter_id:user.id,reported_id:id,reason,details});if(r.error)return toast(r.error.message);toast('Report submitted. Thank you.');closeModal()}
async function blockMember(id){if(!confirm('Block this member? They will no longer appear in your recommendations.'))return;let r=await sb.from('blocks').insert({blocker_id:user.id,blocked_id:id});if(r.error)return toast(r.error.message);toast('Member blocked.');closeModal();showApp('matches')}
function settingsPage(){return `<div class="dashhead"><div><div class="eyebrow">Safety & privacy</div><h1>Privacy & Settings</h1><p class="meta">Control your profile presence and use safety tools.</p></div></div><div class="grid2"><div class="trust"><h3>Profile visibility</h3><p class="meta">Active and complete profiles can be discovered by authenticated members. You can pause your profile below.</p><button class="btn ${profile.active?'danger':'gold'}" onclick="toggleActive()">${profile.active?'Pause profile':'Make profile discoverable'}</button></div><div class="trust"><h3>Verification</h3><p class="meta">Current status: <b>${esc(profile.verification_status||'unverified')}</b></p><button class="btn gold" onclick="requestVerification()">Request verification</button></div><div class="trust"><h3>Safety</h3><p class="meta">Block members who make you uncomfortable. Report suspicious, abusive or inappropriate accounts.</p><button class="btn light" onclick="showBlocked()">Manage blocked members</button></div><div class="trust"><h3>Account</h3><p class="meta">Your email: ${esc(user.email||'')}</p><button class="btn light" onclick="logout()">Log out</button></div></div>`}
async function toggleActive(){let r=await sb.from('profiles').update({active:!profile.active}).eq('id',user.id);if(r.error)return toast(r.error.message);await loadMe();showApp('settings')}
async function showBlocked(){let r=await sb.from('blocks').select('blocked_id,created_at').eq('blocker_id',user.id);let ids=(r.data||[]).map(x=>x.blocked_id);let ps=ids.length?await sb.from('profiles').select('id,full_name,city').in('id',ids):{data:[]};openModal(`<div class="eyebrow">Safety</div><h2 style="font-size:34px;color:var(--navy)">Blocked members</h2><div class="list">${(ps.data||[]).length?(ps.data||[]).map(p=>`<div class="listrow"><div><b>${esc(p.full_name)}</b><div class="small">${esc(p.city||'')}</div></div><button class="btn light" onclick="unblock('${p.id}')">Unblock</button></div>`).join(''):`<div class="empty">No blocked members.</div>`}</div>`)}
async function unblock(id){let r=await sb.from('blocks').delete().eq('blocker_id',user.id).eq('blocked_id',id);if(r.error)return toast(r.error.message);toast('Member unblocked.');closeModal();showApp('settings')}
async function notificationsPage(){let r=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);return `<div class="dashhead"><div><div class="eyebrow">Updates</div><h1>Notifications</h1><p class="meta">Interests, accepted connections and account updates.</p></div><button class="btn light" onclick="markNotificationsRead()">Mark all read</button></div><div class="list">${(r.data||[]).length?(r.data||[]).map(n=>`<div class="listrow" style="${n.read_at?'opacity:.65':''}"><div><b>${esc(n.title)}</b><div class="meta">${esc(n.body||'')}</div></div><span class="small">${new Date(n.created_at).toLocaleString()}</span></div>`).join(''):`<div class="empty">No notifications yet.</div>`}</div>`}
async function updateUnread(){let r=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',user.id).is('read_at',null);if($('navUnread'))$('navUnread').textContent=r.count?`(${r.count})`:''}
async function markNotificationsRead(){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null);showApp('notifications')}
async function logout(){clearInterval(chatTimer);await sb.auth.signOut();user=null;profile=null;prefs=null;landing();toast('Logged out safely.')}
async function boot(){const s=await sb.auth.getSession();if(s.data.session){user=s.data.session.user;await bootMember()}else landing()}
boot();
</script></body></html>
